name: Cube P1 Conformance

on:
  push:
    paths:
      - 'P1/**'
      - 'AIAEAO_Pure_Cube_P0_v9.4/**'
      - '.github/workflows/cube-p1-validation.yml'
  pull_request:
    paths:
      - 'P1/**'
      - 'AIAEAO_Pure_Cube_P0_v9.4/**'
      - '.github/workflows/cube-p1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install independent JSON Schema oracle
        run: python -m pip install 'jsonschema>=4.22,<5'
      - name: P1.5 complete release gate
        run: python P1/release-v1/scripts/verify_p15.py
      - name: P1 Basic Visual Grammar static conformance
        run: python P1/visual-grammar-v1/scripts/verify_visual_grammar.py

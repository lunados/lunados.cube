<text x="104" y="684" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#111827" text-anchor="start">Z-Nummer = Kante des Beispielzeugen; weitere Zyklen nennt der Status</text>
<line x1="32.0" y1="700.0" x2="92.0" y2="700.0" stroke="#111827" stroke-width="1.5"/>
<text x="104" y="704" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#111827" text-anchor="start">einfach = Kante auf keinem Zyklus (in diesem Plan keine)</text>
<text x="104" y="724" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#111827" text-anchor="start">Rahmen K1 = starke Zusammenhangskomponente: jeder Knoten erreicht jeden anderen</text>
<line x1="16.0" y1="740.0" x2="924.0" y2="740.0" stroke="#9ca3af" stroke-width="1"/>

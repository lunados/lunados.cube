<text x="32" y="458" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#111827" text-anchor="start">Zelle (Zeile, Spalte): Zeile erhält Input von Spalte = Zeile dependsOn Spalte (IR/FAD).</text>
<text x="32" y="478" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#111827" text-anchor="start">„d-xx · dependsOn“ = deklarierte Abhängigkeit  ·  „keine · geprüft“ = als vollständig erklärte Zeile ohne Eintrag</text>
<text x="32" y="498" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#111827" text-anchor="start">„offen (nicht erhoben)“ = unbekannt, nicht leer</text>
<text x="32" y="518" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#111827" text-anchor="start">Streifen rechts = ausgeblendete Spalte, mit Namen; graue Diagonale = Element selbst</text>
<line x1="16.0" y1="580.0" x2="924.0" y2="580.0" stroke="#9ca3af" stroke-width="1"/>
<text x="24" y="602" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="start">„geprüft leer“ setzt eine Vollständigkeitserklärung voraus (Lücke G-01). Text und Linien statt Farbe. Keine neuen VG-Anker.</text>
